name: Live feed

# Runs gigwatch against the public job boards and uploads the real output as a
# workflow artifact. The default Actions token is read-only (can't push), so
# Nova's cron (scripts/push_live_feed.py) triggers this, fetches the artifact,
# and commits it to the repo. The landing page then serves fresh job data.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Generate live feed
        run: python scripts/make_live_feed.py live-feed.json
      - name: Upload feed artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-feed
          path: live-feed.json
          if-no-files-found: error
          retention-days: 3
